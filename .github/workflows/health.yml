# Daily health check of the live site: every page in the sitemap and every file it links to.
# On failure it opens (or updates) one GitHub issue labelled "site-health"; on recovery it closes it.
# It never changes the site, so it cannot make an outage worse.
name: Site health

on:
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FCG_BASE_URL: ${{ vars.FCG_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check every page and linked file
        id: check
        shell: bash
        run: node scripts/linkcheck.mjs "$FCG_BASE_URL" 2>&1 | tee linkcheck.txt
      - name: Open or update the health issue
        if: failure() && steps.check.outcome == 'failure'
        run: |
          gh label create site-health --color B60205 --description "Automated live-site health check" 2>/dev/null || true
          body="$(printf 'The daily health check found problems on %s (run %s/%s/actions/runs/%s):\n\n```\n%s\n```\nThe last good deploy is still live; this issue closes itself when the check passes again.' "$FCG_BASE_URL" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(tail -40 linkcheck.txt)")"
          num=$(gh issue list --label site-health --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --body "$body"; else gh issue create --title "Live site health check failing" --label site-health --body "$body"; fi
      - name: Close the health issue after recovery
        if: success()
        run: |
          for n in $(gh issue list --label site-health --state open --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Health check passing again (run $GITHUB_RUN_ID)."
          done
      - name: Keep scheduled workflows alive
        if: always() && github.event_name == 'schedule'
        run: bash .github/scripts/keepalive.sh
